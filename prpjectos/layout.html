<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frases Boas - Redes Sociais</title>
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css ">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <div class="socials">
      <a href="#" class="icon" aria-label="Facebook"><i class="ri-facebook-circle-fill"></i></a>
      <a href="#" class="icon" aria-label="Twitter"><i class="ri-twitter-x-line"></i></a>
      <a href="#" class="icon" aria-label="Instagram"><i class="ri-instagram-fill"></i></a>
      <a href="#" class="icon" aria-label="LinkedIn"><i class="ri-youtube-fill"></i></a>
      <a href="#" class="icon" aria-label="YouTube"><i class="ri-linkedin-box-fill"></i></a>
    </div>
    <div class="center-card">
      <h1 class="title">Bem-vindo ao meu projeto</h1>
      <p class="subtitle">Um layout chamativo com ações rápidas</p>

      <div class="buttons">
        <button id="actionBtn" class="btn primary">Fazer Ação</button>
        <button id="backBtn" class="btn ghost">Voltar</button>
      </div>

      <div id="phraseBox" class="phrase">Clique em "Voltar" para ver frases motivacionais</div>
    </div>

    <footer class="footer-note">Feito com <i class="ri-send-ins-fill"></i> — experimente clicar nos botões</footer>
  </main>

  <script src="javas.js"></script>
</body>
</html>
